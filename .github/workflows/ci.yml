name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

  compatibility:
    name: Package (Node.js ${{ matrix.node-version }}, Express ${{ matrix.express-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
        express-version: [4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install and load packed package
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm install "$RUNNER_TEMP"/cdn-proxy-cache-*.tgz "express@${{ matrix.express-version }}"
          node -e "const express = require('express'); const { createProxyCache } = require('cdn-proxy-cache'); const cache = createProxyCache({ proxyPrefix: '/cache', cachePath: './cache', cacheSeeds: [], shouldProxyPath: () => false }); const app = express(); app.use(cache.proxyPrefix, cache.router); console.log('packed package loaded')"
